{{- if and .Values.metrics.auth.enabled (not .Values.metrics.auth.existingSecret) }}
{{- $secretName := include "eks-upgrade-planner.metricsSecretName" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingToken := "" }}
{{- if and $existingSecret $existingSecret.data }}
{{- $existingToken = index $existingSecret.data .Values.metrics.auth.tokenKey | default "" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "eks-upgrade-planner.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.metrics.auth.tokenKey }}: {{ if .Values.metrics.auth.token }}{{ .Values.metrics.auth.token | b64enc | quote }}{{ else if $existingToken }}{{ $existingToken | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
{{- end }}
