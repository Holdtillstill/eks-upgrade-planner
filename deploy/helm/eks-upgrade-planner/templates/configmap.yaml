apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eks-upgrade-planner.fullname" . }}-config
  labels:
    {{- include "eks-upgrade-planner.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.env.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  HOST: "0.0.0.0"
  PORT: {{ .Values.containerPort | quote }}
  SITE_URL: {{ .Values.env.siteUrl | quote }}
  APP_BASE_URL: {{ .Values.env.siteUrl | quote }}
  APP_VERSION: {{ .Values.env.appVersion | default .Chart.AppVersion | quote }}
  {{- with .Values.env.sourceVersion }}
  SOURCE_VERSION: {{ . | quote }}
  {{- end }}
  {{- with .Values.env.buildTime }}
  BUILD_TIME: {{ . | quote }}
  {{- end }}
  ENABLE_HSTS: {{ .Values.env.enableHsts | quote }}
  ENABLE_DESIGN_EXPLORATIONS: {{ .Values.env.enableDesignExplorations | quote }}
  OTEL_SERVICE_NAME: {{ .Values.otel.serviceName | quote }}
  {{- if .Values.otel.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_LOGS_EXPORTER: {{ ternary "otlp" "none" .Values.otel.logsEnabled | quote }}
  OTEL_RESOURCE_ATTRIBUTES: {{ range $key, $value := .Values.otel.resourceAttributes }}{{ $key }}={{ $value }},{{ end }}deployment.environment={{ .Values.env.nodeEnv }}
  {{- else }}
  OTEL_LOGS_EXPORTER: "none"
  {{- end }}
