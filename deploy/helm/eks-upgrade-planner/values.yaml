replicaCount: 2

image:
  # Set IMAGE_REPOSITORY or --set image.repository=... for production.
  repository: localhost/eks-upgrade-planner
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

containerPort: 8080

env:
  nodeEnv: production
  logLevel: info
  siteUrl: http://localhost:8080
  enableHsts: "true"
  enableDesignExplorations: "false"
  appVersion: ""
  sourceVersion: ""
  buildTime: ""

extraEnv: []

otel:
  enabled: true
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  serviceName: eks-upgrade-planner
  logsEnabled: true
  resourceAttributes:
    service.namespace: public-tools

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # If exposing the app through nginx-ingress, keep /metrics off the public host.
  # Prometheus should scrape the ClusterIP Service/ServiceMonitor instead.
  blockMetricsPath: true
  hosts:
    - host: eks-upgrade-planner.localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

metrics:
  auth:
    # Public Helm defaults require a bearer token for /metrics. Use an
    # existingSecret for stable GitOps installs, or set token for local demos.
    # Setting enabled=false also sets METRICS_ALLOW_UNAUTHENTICATED=true in the
    # rendered ConfigMap; use that only for private local/demo installs.
    enabled: true
    existingSecret: ""
    tokenKey: token
    token: ""

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  labels: {}

grafanaDashboard:
  enabled: true
  labels:
    grafana_dashboard: "1"

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  observabilityNamespace: observability
  ingressFrom: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

nodeSelector: {}
tolerations: []
affinity: {}
