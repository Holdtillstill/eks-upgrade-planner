name: Deploy Cloudflare Pages mirror

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL || vars.SITE_URL || 'https://cf.example.com' }}
    steps:
      - name: Check required Cloudflare variables
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set secret CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?Set secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Set repository variable CLOUDFLARE_PAGES_PROJECT}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build mirror
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy dist --project-name "${CLOUDFLARE_PAGES_PROJECT}" --branch "${GITHUB_REF_NAME}"
