name: Deploy Cloudflare Pages mirror

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
      SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
    steps:
      - name: Check required Cloudflare variables
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set secret CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?Set secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Set secret CLOUDFLARE_PAGES_PROJECT}"
          : "${SITE_URL:?Set repository variable CLOUDFLARE_SITE_URL for mirror canonical and smoke checks}"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --include=optional
          node -e "require('lightningcss')"
          npx playwright install --with-deps chromium

      - name: Build mirror
        run: |
          npm run validate:edge-security
          npm run build
          npm run validate:static-hosting

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy dist --project-name "${CLOUDFLARE_PAGES_PROJECT}" --branch "${GITHUB_REF_NAME}"

      - name: Smoke Cloudflare Pages mirror
        run: |
          WEB_BASE="${SITE_URL}" npm run smoke:static-host
          WEB_BASE="${SITE_URL}" npm run smoke:browser-host
