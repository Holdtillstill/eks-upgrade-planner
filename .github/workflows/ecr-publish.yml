name: Publish ECR image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - server/**
      - scripts/**
      - src/**
      - public/**
      - .github/workflows/ecr-publish.yml

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  AWS_ROLE_TO_ASSUME: ${{ vars.ECR_AWS_ROLE_TO_ASSUME }}
  ECR_REPOSITORY: eks-upgrade-planner
  SITE_URL: http://eks-upgrade-planner.preview.bozhi.dev

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Compute build metadata
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:main
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            APP_VERSION=main
            SOURCE_VERSION=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
