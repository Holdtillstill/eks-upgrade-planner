name: Publish ECR image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.ECR_AWS_ROLE_TO_ASSUME }}
  ECR_REPOSITORY: eks-upgrade-planner
  SITE_URL: ${{ vars.EKS_PREVIEW_SITE_URL || 'https://eks-upgrade-planner-preview.bozhi.dev' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check required ECR variables
        run: |
          : "${AWS_ROLE_TO_ASSUME:?Set Actions secret ECR_AWS_ROLE_TO_ASSUME}"

      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Compute build metadata
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:main
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            APP_VERSION=main
            SOURCE_VERSION=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.created }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        run: |
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:main"
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
