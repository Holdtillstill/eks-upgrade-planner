name: EKS data refresh

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SITE_URL: ${{ vars.SITE_URL || 'https://eks-upgrade-planner.bozhi.dev' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh static EKS data
        run: npm run data:update

      - name: Detect data changes
        id: data_changes
        run: |
          if git diff --quiet -- src/data/versions.ts scripts/public-routes.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate refreshed app
        run: |
          npm run check:public-readiness
          npm test
          npm run lint
          npm run build
          npm run validate:static-hosting

      - name: Open data refresh pull request
        if: steps.data_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/eks-live-refresh
          delete-branch: true
          add-paths: |
            src/data/versions.ts
            scripts/public-routes.js
          commit-message: 'chore: refresh eks lifecycle data'
          title: 'chore: refresh EKS lifecycle data'
          body: |
            Automated EKS data refresh from:

            - AWS EKS Kubernetes version lifecycle docs
            - AWS EKS platform versions docs
            - endoflife.date Amazon EKS archive

            Validation runs `npm test`, `npm run lint`, and a production build.
