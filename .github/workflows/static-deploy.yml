name: Deploy static site

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: static-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      S3_BUCKET: ${{ vars.STATIC_SITE_BUCKET }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check required deployment variables
        run: |
          : "${AWS_ROLE_TO_ASSUME:?Set repository variable AWS_ROLE_TO_ASSUME}"
          : "${CLOUDFRONT_DISTRIBUTION_ID:?Set repository variable CLOUDFRONT_DISTRIBUTION_ID}"
          : "${S3_BUCKET:?Set repository variable STATIC_SITE_BUCKET}"
          : "${SITE_URL:?Set repository variable SITE_URL}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate app
        run: |
          npm test
          npm run lint
          npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Validate static hosting output
        run: npm run validate:static-hosting

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload non-asset files with short browser cache
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=300"

      - name: Mark prerendered HTML as revalidating content
        run: |
          aws s3 cp dist/ "s3://${S3_BUCKET}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache"

          aws s3 cp dist/404.html "s3://${S3_BUCKET}/404.html" \
            --cache-control "no-store"

      - name: Upload hashed assets with immutable cache
        run: |
          if [ -d dist/assets ]; then
            aws s3 sync dist/assets/ "s3://${S3_BUCKET}/assets/" \
              --delete \
              --cache-control "public, max-age=31536000, immutable"
          fi

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
