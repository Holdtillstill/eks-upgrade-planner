name: Deploy static site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/static-deploy.yml
      - index.html
      - package-lock.json
      - package.json
      - infra/cloudfront/**
      - infra/terraform/static-hosting/**
      - public/**
      - server/security.js
      - scripts/**
      - src/**

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: static-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      S3_BUCKET: ${{ secrets.STATIC_SITE_BUCKET }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check required deployment variables
        run: |
          : "${AWS_ROLE_TO_ASSUME:?Set Actions secret AWS_ROLE_TO_ASSUME}"
          : "${CLOUDFRONT_DISTRIBUTION_ID:?Set Actions secret CLOUDFRONT_DISTRIBUTION_ID}"
          : "${S3_BUCKET:?Set Actions secret STATIC_SITE_BUCKET}"
          : "${SITE_URL:?Set repository variable SITE_URL}"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --include=optional
          node -e "require('lightningcss')"
          npx playwright install --with-deps chromium

      - name: Validate app
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run validate:edge-security

      - name: Build static site
        run: npm run build

      - name: Validate static hosting output
        run: npm run validate:static-hosting

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Upload non-asset files with short browser cache
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=300"

      - name: Mark prerendered HTML as revalidating content
        run: |
          aws s3 cp dist/ "s3://${S3_BUCKET}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache"

          aws s3 cp dist/404.html "s3://${S3_BUCKET}/404.html" \
            --cache-control "no-store"

      - name: Upload hashed assets with immutable cache
        run: |
          if [ -d dist/assets ]; then
            aws s3 sync dist/assets/ "s3://${S3_BUCKET}/assets/" \
              --delete \
              --cache-control "public, max-age=31536000, immutable"
          fi

      - name: Invalidate CloudFront
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"

      - name: Smoke deployed static host
        run: WEB_BASE="${SITE_URL}" npm run smoke:static-host

      - name: Smoke deployed browser rendering
        run: WEB_BASE="${SITE_URL}" npm run smoke:browser-host
