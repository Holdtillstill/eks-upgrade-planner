name: Cleanup EKS previews

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: eks-preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.EKS_PREVIEW_AWS_ROLE_TO_ASSUME }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
    steps:
      - name: Check required preview variables
        id: preview_config
        run: |
          if [ -n "${AWS_ROLE_TO_ASSUME}" ] && [ -n "${EKS_CLUSTER_NAME}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "configured=false" >> "${GITHUB_OUTPUT}"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            echo "Preview cleanup is not configured; skipping scheduled cleanup."
            exit 0
          fi

          : "${AWS_ROLE_TO_ASSUME:?Set Actions secret EKS_PREVIEW_AWS_ROLE_TO_ASSUME}"
          : "${EKS_CLUSTER_NAME:?Set Actions secret EKS_CLUSTER_NAME}"

      - name: Configure AWS credentials
        if: ${{ steps.preview_config.outputs.configured == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Set up kubectl
        if: ${{ steps.preview_config.outputs.configured == 'true' }}
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        if: ${{ steps.preview_config.outputs.configured == 'true' }}
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        if: ${{ steps.preview_config.outputs.configured == 'true' }}
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Remove expired preview namespaces
        if: ${{ steps.preview_config.outputs.configured == 'true' }}
        run: |
          now_epoch="$(date -u +%s)"
          namespaces="$(kubectl get namespace \
            -l preview.eks-upgrade-planner.io/enabled=true \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"

          if [ -z "${namespaces}" ]; then
            echo "No preview namespaces found."
            exit 0
          fi

          while IFS= read -r namespace; do
            [ -n "${namespace}" ] || continue
            expires_at="$(kubectl get namespace "${namespace}" -o jsonpath='{.metadata.annotations.preview\.eks-upgrade-planner\.io/expires-at}')"
            release="$(kubectl get namespace "${namespace}" -o jsonpath='{.metadata.annotations.preview\.eks-upgrade-planner\.io/release}')"
            release="${release:-eks-upgrade-planner}"

            if [ -z "${expires_at}" ]; then
              echo "Skipping ${namespace}: missing expires-at annotation."
              continue
            fi

            expires_epoch="$(date -u -d "${expires_at}" +%s 2>/dev/null || true)"
            if [ -z "${expires_epoch}" ]; then
              echo "Skipping ${namespace}: invalid expires-at annotation ${expires_at}."
              continue
            fi

            if [ "${expires_epoch}" -gt "${now_epoch}" ]; then
              echo "Keeping ${namespace}: expires at ${expires_at}."
              continue
            fi

            echo "Removing expired preview namespace ${namespace}."
            helm uninstall "${release}" -n "${namespace}" --ignore-not-found || true
            kubectl delete namespace "${namespace}" --ignore-not-found=true --wait=false
          done <<< "${namespaces}"
