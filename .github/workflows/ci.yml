name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://eks-upgrade-planner.bozhi.dev' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Public readiness checks
        run: npm run check:public-readiness

      - name: Check EKS lifecycle data freshness
        run: npm run data:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate edge security config
        run: npm run validate:edge-security

      - name: Validate Actions secret usage
        run: npm run validate:actions-secrets

      - name: Build
        run: npm run build

      - name: Validate static hosting output
        run: npm run validate:static-hosting

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: eks-upgrade-planner:${{ github.sha }}
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            APP_VERSION=ci
            SOURCE_VERSION=${{ github.sha }}
            BUILD_TIME=ci

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: eks-upgrade-planner:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
