<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--app-meta-start-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('eks-upgrade-planner:theme') === 'dark' ? 'dark' : 'light';
          const root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.dataset.theme = theme;
          root.dataset.appVersion = 'v2';
        } catch {
          document.documentElement.dataset.appVersion = 'v2';
        }
      })();
    </script>
    <meta
      name="description"
      content="Plan Amazon EKS Kubernetes upgrades with lifecycle deadlines, extended support cost estimates, upgrade hops, add-on checks, and local deprecated API scanning."
    />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EKS Upgrade Planner" />
    <meta property="og:title" content="EKS Upgrade Planner" />
    <meta
      property="og:description"
      content="A public, client-side EKS upgrade planning tool for lifecycle risk, cost exposure, add-on readiness, and validation reports."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/social-preview.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EKS Upgrade Planner" />
    <meta
      name="twitter:description"
      content="Plan EKS upgrade windows, support costs, add-on checks, and deprecated API cleanup from a static-heavy web tool."
    />
    <meta name="twitter:image" content="__SITE_URL__/social-preview.jpg" />
    <title>EKS Upgrade Planner | Kubernetes Upgrade Risk, Cost, and Readiness</title>
    <!--app-meta-end-->
  </head>
  <body>
    <div id="root"></div>
    <script defer src="https://on-demand-demos.bozhi.dev/visitor.js" data-project="eks-upgrade-planner"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
